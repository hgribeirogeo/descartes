ACTIONS.exportReport = () => {
  const p=cur(); const w=window.open('','_blank'); if(!w) return toast('Permita pop-ups para gerar o relatório.');
  const sec=Object.entries(ITEMS).map(([k,def])=>{ const A=p.items[k].analyses.at(-1); const t=itemText(p,k);
    return `<h2>${esc(def.name)}</h2><pre>${esc(t||'—')}</pre>${A?`<p>Análise de ${fmtDate(A.at)} · índice de novidade <b>${A.novelty}</b> · ${A.top.length} artigos lidos de ${A.corpusN} no corpus.</p>
      <table><tr><th>Critério</th><th>Fonte</th><th>Situação</th><th>Justificativa</th><th>Onde melhorar</th></tr>${A.criteria.map(c=>`<tr><td>${esc(c.t)}</td><td>${SRC_LABEL[c.src]}</td><td>${STATUS[c.status][1]}</td><td>${esc(c.justificativa||'')}</td><td>${esc(c.sugestao||'')}</td></tr>`).join('')}</table>
      ${A.summary.length?`<h3>O que a literatura diz</h3>${A.summary.map(f=>`<p>${esc(f.texto)} [${f.ids.map(id=>{const r=recById(p,id); return r?esc(refShort(r)):'';}).join('; ')}]</p>`).join('')}`:''}`:'<p>Sem análise.</p>'}`; }).join('');
  const refs=new Set(); Object.keys(ITEMS).forEach(k=>{ const A=p.items[k].analyses.at(-1); if(A){ A.summary.forEach(f=>f.ids.forEach(i=>refs.add(i))); A.criteria.forEach(c=>(c.ids||[]).forEach(i=>refs.add(i))); } });
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Descartes — ${esc(p.title)}</title><style>body{font:11pt/1.45 Georgia,serif;max-width:820px;margin:24px auto;padding:0 16px;color:#111}h1{font-size:19pt}h2{font-size:14pt;margin-top:22px;border-bottom:1px solid #ccc}pre{white-space:pre-wrap;font:inherit;background:#f6f6f6;padding:8px}table{border-collapse:collapse;width:100%;font-size:9.5pt;margin:6px 0}td,th{border:1px solid #ccc;padding:3px 6px;text-align:left;vertical-align:top}li{font-size:9.5pt}</style></head><body>
  <h1>${esc(p.title)}</h1><p>Relatório do Descartes v${VERSION}, ${fmtDate(nowISO())}${p.journal?.name?` · revista-alvo: ${esc(p.journal.name)}`:''}.</p>${sec}
  <h2>Referências citadas</h2><ul>${[...refs].map(id=>recById(p,id)).filter(Boolean).map(r=>`<li>${esc(r.authors||'')} (${r.year||'s.d.'}). ${esc(r.title)}. ${esc(r.venue||'')}${r.doi?` https://doi.org/${esc(r.doi)}`:''}</li>`).join('')}</ul>
  <script>setTimeout(()=>print(),400)<\/script></body></html>`); w.document.close();
};

/* ---------- Catálogo de revistas do LabResearch ---------- */
const pick = (o, keys) => { for (const k of Object.keys(o)) if (keys.includes(k.toLowerCase())) { const v=o[k]; if (typeof v==='string' && v.trim()) return v.trim(); } return ''; };
function findJournals(obj, out=[], depth=0){
  if (!obj || depth>6) return out;
  if (Array.isArray(obj)){
    const objs=obj.filter(x=>x && typeof x==='object' && !Array.isArray(x));
    const looks=objs.filter(x=>Object.keys(x).some(k=>/issn/i.test(k)) && pick(x,['nome','name','titulo','title','periodico','journal']));
    if (looks.length>=3 && looks.length>=objs.length*0.5){ for (const x of looks) out.push({nome:pick(x,['nome','name','titulo','title','periodico','journal']), issn:pick(x,['issn','eissn','issn_e','issnl','issn_l']),
        pagina:pick(x,['pagina','url','homepage','site','link','page']), normas:pick(x,['normas','guia','instrucoes','authorguide','guide','guidelines','normasurl']), escopo:pick(x,['escopo','scope','aims','aimsscope','escopourl']), qualis:pick(x,['qualis'])}); return out; }
    for (const x of obj) findJournals(x, out, depth+1); return out;
  }
  if (typeof obj==='object') for (const v of Object.values(obj)) findJournals(v, out, depth+1);
  return out;
}
async function setCatalog(list){ const m=new Map(); for (const j of list){ if (!j.nome) continue; const k=normTxt(j.nome), o=m.get(k); if (!o) m.set(k, {...j}); else for (const f of ['issn','pagina','normas','escopo','qualis']) if (!o[f] && j[f]) o[f]=j[f]; } if (!m.size) return false;
  S.catalog=[...m.values()].sort((a,b)=>a.nome.localeCompare(b.nome)); await DB.put('kv', S.catalog, 'catalog'); return true; }
/* Catálogo do LabResearch: os periódicos que você cadastrou (Gist) + o catálogo Springer embutido na página do LabResearch (mesmo domínio) */
async function labCatalog(g){
  const out=[]; const fc=async n=>{ try{ return JSON.parse(await Sync.fileContent(g?.files?.[n])||'null'); }catch(e){ return null; } };
  const qm=(g && await fc('labresearch_qualis.json'))||{};
  for (const p of (g && await fc('labresearch_periodicos.json'))||[]) if (p?.nome) out.push({nome:p.nome, issn:p.issn||'', pagina:p.url||'', normas:'', escopo:'', qualis:p.qualis||qm[p.issn]||''});
  try{ const r=await fetch(location.origin+'/manuscritos/index.html',{cache:'no-cache'}); if (r.ok){ const h=await r.text();
    const m=h.match(/const CATALOGO=(\[[\s\S]*?\]);\s*\n/), im=h.match(/const CAT_IMP=(\[[^\n]*?\]);/);
    if (m){ const imp=im?JSON.parse(im[1]):[]; for (const c of JSON.parse(m[1])){ const b='https://link.springer.com/journal/'+c[0], nature=imp[c[3]]==='Springer Nature';
      out.push({nome:c[1], issn:c[2], pagina:'https://springer.com/'+c[0], normas:nature?'':b+'/submission-guidelines', escopo:nature?'':b+'/aims-and-scope', qualis:qm[c[2]]||''}); } } } }catch(e){}
  return out;
}
/* ---------- Sincronização pelo Gist ---------- */
const Sync = {
  status:'local', timer:null, running:false,
  ok(){ return !!(S.config.gistId && S.config.githubToken); },
  setStatus(s){ this.status=s; const el=$('#syncStatus'); if(el){ el.textContent=s; el.dataset.act='syncNow'; el.style.cursor='pointer'; } },
  init(){ if (this.ok()) this.sync(); else { this.setStatus('local'); if (!S.catalog.length) labCatalog(null).then(l=>setCatalog(l)).then(ok=>ok&&render()); } },
  async gh(method, body){ const r=await fetch(`https://api.github.com/gists/${S.config.gistId.trim()}`,{method, headers:{Authorization:'Bearer '+S.config.githubToken.trim(), Accept:'application/vnd.github+json', ...(body?{'Content-Type':'application/json'}:{})}, body:body?JSON.stringify(body):undefined});
    if (!r.ok) throw new Error(({401:'token inválido, expirado ou revogado (HTTP 401). Gere um token clássico com escopo gist e cole de novo',403:'o token não tem permissão para Gists ou o limite de uso foi atingido (HTTP 403)',404:'Gist não encontrado (HTTP 404). Confira o ID: use o mesmo do LabResearch'})[r.status]||('GitHub HTTP '+r.status)); return r.json(); },
  async fileContent(f){ if (!f) return null; if (f.truncated){ const r=await fetch(f.raw_url); return r.ok? r.text() : null; } return f.content; },
  mergeProjects(list){ let n=0; for (const rp of list){ migrate(rp); const lp=S.projects.find(p=>p.id===rp.id); if(!lp){ S.projects.push(rp); n++; } else if ((rp.updatedAt||'')>(lp.updatedAt||'')){ Object.assign(lp,rp); n++; } } return n; },
  mergePrograms(list){ for (const rp of list){ const lp=S.programs.find(p=>p.id===rp.id); if(!lp) S.programs.push(rp); else if ((rp.updatedAt||'')>(lp.updatedAt||'')) Object.assign(lp,rp); } },
  async sync(){
    if (this.running || !this.ok()) return; this.running=true; this.setStatus('Gist: sincronizando…');
    try{
      const g=await this.gh('GET'); const deleted=(await DB.get('kv','deleted'))||{};
      const mine=await this.fileContent(g.files?.['descartes.json']);
      if (mine){ const remote=JSON.parse(mine); Object.assign(deleted, remote.deleted||{});
        this.mergeProjects((remote.projects||[]).filter(p=>!deleted[p.id])); this.mergePrograms(remote.programs||[]); }
      for (const id of Object.keys(deleted)) if (S.projects.find(p=>p.id===id)){ S.projects=S.projects.filter(p=>p.id!==id); await DB.del('projects',id); }
      for (const p of S.projects) await DB.put('projects',p); await DB.put('kv',S.programs,'programs'); await DB.put('kv',deleted,'deleted');
      // catálogo: arquivos do LabResearch no mesmo Gist
      const js=[]; for (const [name,f] of Object.entries(g.files||{})){ if (name==='descartes.json' || !/\.json$/i.test(name)) continue; try{ findJournals(JSON.parse(await this.fileContent(f)), js); }catch(e){} }
      js.push(...await labCatalog(g));
      if (!js.length && !mine) throw new Error('este Gist não é o do LabResearch (não tem o catálogo de revistas nem dados do Descartes). Confira o ID; nada foi gravado nele');
      if (js.length) await setCatalog(js);
      await this.gh('PATCH', {files:{'descartes.json':{content:JSON.stringify({app:'descartes', version:VERSION, at:nowISO(), projects:S.projects, programs:S.programs, deleted})}}});
      if (!S.projects.find(p=>p.id===S.currentId)) S.currentId=S.projects[0]?.id||null;
      this.setStatus('Gist: '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})); render();
    }catch(e){ this.setStatus('Gist: erro — '+e.message.split(' (')[0]); toast('Sincronização: '+e.message, 9000); }
    this.running=false;
  },
  schedule(){ if (!this.ok()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.sync(), 10000); },
  async markDeleted(id){ const d=(await DB.get('kv','deleted'))||{}; d[id]=nowISO(); await DB.put('kv',d,'deleted'); this.schedule(); },
};
ACTIONS.syncNow = () => Sync.ok() ? Sync.sync() : (S.view='config', render(), toast('Configure o Gist primeiro.'));

/* ---------- Exportar uma análise (TXT ou Word .docx) ---------- */
const CLS_PT={ja_responde:'já responde', em_parte:'em parte', nao_responde:'não responde', fora_do_tema:'fora do tema'};
const SRC_PT={texto:'texto do item', cadeia:'coerência com outro item', revista:'revista', lit:'literatura', literatura:'literatura'};
function refFull(r){ if(!r) return ''; const au=(r.authors||'').split(';').map(s=>s.trim()).filter(Boolean); return `${au.length?au.slice(0,3).join('; ')+(au.length>3?' et al.':''):'s.a.'} (${r.year||'s.d.'}). ${r.title||''}.${r.venue?' '+r.venue+'.':''}${r.doi?' https://doi.org/'+r.doi:''}`; }
function analysisModel(p, key, A){
  const def=ITEMS[key], it=p.items[key], B=[]; const H=t=>B.push({h:t}), P=(t,b)=>B.push({p:t,b}), T=(rows)=>B.push({t:rows}), L=a=>B.push({l:a});
  B.push({title:`Descartes — análise: ${def.name}`});
  P(`Projeto: ${p.title}`); P(`Data: ${fmtDate(A.at)}${A.dur?` · duração: ${fmtDur(A.dur)}`:''} · modelo: ${A.model||S.config.ollamaModel} · artigos lidos: ${A.top.length} · Descartes v${VERSION}`);
  if (key==='pergunta' && p.journal?.name) P(`Revista-alvo: ${p.journal.name}${p.journal.qualis?` (Qualis ${p.journal.qualis})`:''}`);
  H(def.name); P(A.text);
  if (A.warnings.length){ H('Avisos'); L(A.warnings); }
  H('Consultas de busca (Semantic Scholar)'); T([['Consulta','Resultados'], ...A.queries.map(q=>[q, String(A.totals.find(x=>x.q===q)?.total??'—')])]);
  if (it.concepts?.length){ H('Conceitos extraídos'); T([['Papel','Conceito','Termos'], ...it.concepts.map(b=>[PAPEL[b.papel]||b.papel, b.rotulo, b.terms.join(' | ')])]); }
  H('Indicadores'); T([['Índice de novidade','Artigos lidos','Do tema','Fora do tema','No corpus com resumo','Resultados das buscas'],
    [String(A.novelty??'—'), String(A.top.length), String(A.onTopic??'—'), String(A.foraN??'—'), String(A.corpusN), String(A.totals.reduce((s,x)=>s+(x.total||0),0))]]);
  T([['Entre os mais próximos','Do tema','Fora do tema','Já respondem','Em parte','Índice'], ...A.sat.map(s=>[s.n,s.on??s.n,s.fora??'—',s.ja,s.pa,s.idx??'—'].map(String))]);
  P('Índice = 100 × (1 − (já respondem + ½ em parte) ÷ artigos do tema lidos). Mede a sobreposição com os artigos mais próximos que as buscas encontraram; depende das consultas e da cobertura da base.');
  H('Critérios'); T([['Critério','Status','Fonte'], ...A.criteria.map(c=>[c.t, STATUS[c.status]?.[1]||c.status, SRC_PT[c.src]||c.src])]);
  for (const c of A.criteria){
    P(`${c.t} — ${STATUS[c.status]?.[1]||c.status}${c.id==='novidade'&&A.novelty!=null?` (índice ${A.novelty})`:''}`, true);
    if (c.justificativa) P(c.justificativa); if (c.sugestao) P('Onde melhorar: '+c.sugestao);
    if (c.trecho) P(`Trecho do item: “${c.trecho}”${c.trechoOK?'':' (não encontrado no item)'}`);
    const refs=(c.ids||[]).map(id=>refFull(recById(p,id))).filter(Boolean); if (refs.length){ P('Evidência:'); L(refs); }
    if (c.venueRefs?.length){ P(`Artigos da revista com termos próximos (${c.venueN}):`); L(c.venueRefs.map(r=>`${r.title} (${r.year||'s.d.'})${r.doi?' https://doi.org/'+r.doi:''}`)); }
  }
  if (A.summary.length){ H('O que a literatura diz'); for (const f of A.summary) P(`${f.texto} [${f.ids.map(id=>refPlain(recById(p,id))).join('; ')}]`); }
  const ck=A.ck||(key+'|'+A.textHash);
  H('Artigos lidos (do mais ao menos próximo)');
  T([['#','Classe','Proximidade','Referência','Trecho do resumo'], ...A.top.map((t,i)=>{ const r=recById(p,t.id); const c=r?.cls?.[ck]; return [String(i+1), CLS_PT[t.classe]||t.classe, String(t.s), refFull(r), c?.trecho||'']; })]);
  const rel=A.top.filter(t=>t.classe==='ja_responde'||t.classe==='em_parte');
  if (rel.length){ H('Referências que já respondem ou respondem em parte'); L(rel.map(t=>refFull(recById(p,t.id)))); }
  return B;
}
function modelToTxt(B){
  const out=[];
  for (const b of B){
    if (b.title) out.push(b.title.toUpperCase(), '='.repeat(Math.min(80,b.title.length)), '');
    else if (b.h) out.push('', b.h.toUpperCase(), '-'.repeat(Math.min(80,b.h.length)));
    else if (b.p!=null) out.push(b.b?'\n'+b.p:b.p);
    else if (b.l) out.push(...b.l.map(x=>'  - '+x));
    else if (b.t){ const [hd,...rows]=b.t; for (const r of rows) out.push('  '+r.map((v,i)=>`${hd[i]}: ${v}`).join(' | ')); }
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n')+'\n';
}
/* .docx mínimo: ZIP sem compressão com [Content_Types].xml, _rels/.rels e word/document.xml */
const xmlEsc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function docxXml(B){
  const run=(t,{b=false,sz=22}={})=>`<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${b?'<w:b/>':''}<w:sz w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
  const para=(t,o={},sp=120)=>`<w:p><w:pPr><w:spacing w:after="${sp}"/></w:pPr>${run(t,o)}</w:p>`;
  const body=B.map(b=>{
    if (b.title) return para(b.title,{b:true,sz:32},240);
    if (b.h) return `<w:p><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/></w:pPr>${run(b.h,{b:true,sz:26})}</w:p>`;
    if (b.p!=null) return para(b.p,{b:!!b.b});
    if (b.l) return b.l.map(x=>`<w:p><w:pPr><w:spacing w:after="60"/><w:ind w:left="360" w:hanging="220"/></w:pPr>${run('• '+x,{sz:20})}</w:p>`).join('');
    if (b.t){ const bd='<w:top w:val="single" w:sz="4" w:color="999999"/><w:left w:val="single" w:sz="4" w:color="999999"/><w:bottom w:val="single" w:sz="4" w:color="999999"/><w:right w:val="single" w:sz="4" w:color="999999"/><w:insideH w:val="single" w:sz="4" w:color="999999"/><w:insideV w:val="single" w:sz="4" w:color="999999"/>';
      return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
        b.t.map((r,i)=>`<w:tr>${i===0?'<w:trPr><w:tblHeader/></w:trPr>':''}${r.map(c=>`<w:tc><w:tcPr>${i===0?'<w:shd w:val="clear" w:color="auto" w:fill="E8EEF4"/>':''}</w:tcPr><w:p><w:pPr><w:spacing w:after="0"/></w:pPr>${run(c,{b:i===0,sz:18})}</w:p></w:tc>`).join('')}</w:tr>`).join('')+`</w:tbl><w:p/>`; }
    return '';
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}
const CRC_T=(()=>{ const t=new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
const crc32=u=>{ let c=0xFFFFFFFF; for (const b of u) c=CRC_T[(c^b)&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zipStore(files){   // files: [[nome, texto]]
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for (const [name,text] of files){
    const nb=enc.encode(name), db=enc.encode(text), crc=crc32(db);
    const head=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)];
    parts.push(new Uint8Array([0x50,0x4b,3,4,...head]), nb, db);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...head,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nb);
    off+=30+nb.length+db.length;
  }
  const cs=cen.reduce((s,x)=>s+x.length,0);
  return new Blob([...parts,...cen,new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)])],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function docxBlob(B){
  return zipStore([
    ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ['word/document.xml', docxXml(B)]]);
}
ACTIONS.exportA = el => {
  const p=cur(), key=el.dataset.k, A=p.items[key].analyses.find(a=>a.id===el.dataset.a); if (!A) return;
  const B=analysisModel(p, key, A), base=`descartes_${key}_${normTxt(p.title).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)}_${A.at.slice(0,10)}`;
  if (el.dataset.f==='txt') download(base+'.txt', modelToTxt(B), 'text/plain;charset=utf-8');
  else { const a=document.createElement('a'); a.href=URL.createObjectURL(docxBlob(B)); a.download=base+'.docx'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
};
