<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descartes</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#5d6670;--line:#dde1e6;
  --acc:#1f3a5f;--acc2:#2f6db5;--ok:#1e7d4f;--warn:#b26a00;--bad:#b3261e;
  --chip:#eef2f7;--radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121417;--card:#1b1f24;--ink:#e8eaed;--muted:#9aa3ad;--line:#2d333a;
  --acc:#8fb3e0;--acc2:#6aa0e6;--ok:#5cc58f;--warn:#e0a54a;--bad:#ef7b72;--chip:#252b33;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:18px;color:var(--acc);margin-right:6px}
header nav{display:flex;gap:4px;flex-wrap:wrap}
header nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit}
header nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
header .grow{flex:1}
main{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:12px 0 6px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:240px 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.grid2>div{min-width:0}
.card{overflow-wrap:anywhere}
label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
button.b{background:var(--acc2);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-size:14px}
button.b.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
button.b.danger{background:var(--bad)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){.stepper{flex-direction:row;overflow-x:auto}}
.step{border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--card);white-space:nowrap}
.step.on{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2)}
.step .st{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
.crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.crit.obr{border-left:4px solid var(--acc2)}
.scores{display:flex;gap:4px;flex-wrap:wrap}
.scores button{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.scores button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.quote{border-left:3px solid var(--line);padding:2px 8px;margin:4px 0;color:var(--muted);font-style:italic}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink);font:inherit;font-size:14px}
.tabs button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.progress{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:var(--acc2)}
.mx td,.mx th{text-align:center}
.mx select{width:auto;padding:2px 4px}
.cell0{background:color-mix(in srgb,var(--warn) 22%,transparent)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-size:14px;display:none;z-index:20;max-width:90vw}
.rec{border-bottom:1px solid var(--line);padding:8px 0}
.rec .t{font-weight:600}
details summary{cursor:pointer}
.kpi{display:inline-block;margin-right:18px}
.hint{margin:2px 0 4px}.hint summary{font-size:12px;color:var(--acc2);font-weight:600;list-style:none}.hint summary::-webkit-details-marker{display:none}.hint[open]{background:var(--chip);border-radius:8px;padding:6px 10px}
.kpi b{font-size:20px;display:block}
</style>
</head>
<body>
<header>
  <span class="brand">Descartes</span>
  <select id="projSel" style="width:auto;max-width:240px"></select>
  <nav id="nav"></nav>
  <span class="grow"></span>
  <span id="llmStatus" class="pill" data-act="recheckLLM" style="cursor:pointer" title="Clique para verificar de novo">IA: verificando…</span>
  <span id="syncStatus" class="pill">local</span>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>

/* ---- core.js ---- */
'use strict';
/* ================= Descartes v0.2 — núcleo ================= */
const VERSION = '0.2.6';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const fmtDate = iso => iso ? new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '';
function toast(msg, ms=3200){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', ms); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return h.toString(36); }
function normTxt(s){
  return String(s||'').normalize('NFKC').toLowerCase()
    .replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"')
    .replace(/[‐-―−]/g,'-').replace(/\s+/g,' ').trim();
}
function quoteOK(quote, source){
  const q = normTxt(quote).replace(/^["'\s.,;:]+|["'\s.,;:]+$/g,'');
  if (q.length < 6) return false;
  const src = normTxt(source);
  const parts = q.split(/\s*(?:\.\.\.|…|\[\.\.\.\])\s*/).filter(p => p.length >= 4);
  if (!parts.length) return false;
  return parts.every(p => src.includes(p));
}

/* ---------- IndexedDB ---------- */
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('descartes',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('projects',{keyPath:'id'}); d.createObjectStore('kv'); };
    r.onsuccess=()=>{ DB.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  tx(store, mode='readonly'){ return DB.db.transaction(store, mode).objectStore(store); },
  all(store){ return new Promise((res,rej)=>{ const r=DB.tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  put(store, val, key){ return new Promise((res,rej)=>{ const r=key===undefined?DB.tx(store,'readwrite').put(val):DB.tx(store,'readwrite').put(val,key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  get(store, key){ return new Promise((res,rej)=>{ const r=DB.tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  del(store, key){ return new Promise((res,rej)=>{ const r=DB.tx(store,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
};

/* ---------- Estado ---------- */
const DEFAULT_CONFIG = {
  provider:'ollama', ollamaBase:'http://localhost:11434', ollamaModel:'qwen3:14b', embedModel:'qwen3-embedding:0.6b',
  openalexKey:'', email:'', temperature:0.2,
  gistId:'', githubToken:'', k:100, perQuery:300,
};
const S = { config:{...DEFAULT_CONFIG}, projects:[], programs:[], catalog:[], currentId:null, view:'pergunta', litTab:'fontes', busy:{} };
const cur = () => S.projects.find(p => p.id === S.currentId) || null;

function newProject(title){
  return { id:uid('p'), title, createdAt:nowISO(), updatedAt:nowISO(), journal:null, programId:'',
    items:{ pergunta:{fields:{}, queries:'', analyses:[]}, hipotese:{fields:{}, queries:'', analyses:[]}, contrafactual:{fields:{}, queries:'', analyses:[]} },
    diary:[],
    lit:{ records:[], searches:[], criteria:'', schema:[], validation:{threshold:0.6, locked:false, sample:[], manual:{}, equiv:{}, done:false},
          gap:{claim:'', declared:false, justification:'', decisions:{}}, clusters:null, core:[], coreNotes:{}, k:6 } };
}
let saveTimer=null;
function touch(p=cur()){ if(!p) return; p.updatedAt = nowISO(); clearTimeout(saveTimer); saveTimer=setTimeout(()=>persist(p), 400); }
async function persist(p){ try{ await DB.put('projects', p); Sync.schedule(); }catch(e){ console.error(e); toast('Erro ao salvar: '+e.message); } }
async function saveConfig(){ await DB.put('kv', S.config, 'config'); }
function logDiary(p, entry){ p.diary.push({ id:uid('d'), at:nowISO(), ...entry }); }

/* ---------- Navegação ---------- */
const VIEWS = [['pergunta','Pergunta'],['hipotese','Hipótese'],['contrafactual','Contrafactual'],['programa','Programa'],['literatura','Literatura'],['config','Configurações']];
function renderNav(){
  $('#nav').innerHTML = VIEWS.map(([k,l]) => `<button data-act="view" data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('');
  const sel = $('#projSel');
  sel.innerHTML = S.projects.map(p => `<option value="${p.id}" ${p.id===S.currentId?'selected':''}>${esc(p.title)}</option>`).join('') + `<option value="__new">+ Novo projeto…</option>`;
}
function render(){
  renderNav();
  const p = cur(); const app = $('#app');
  if (S.view==='config'){ app.innerHTML = renderConfig(); return; }
  if (S.view==='programa'){ app.innerHTML = renderProgram(); return; }
  if (!p){ app.innerHTML = `<div class="card"><h2>Descartes</h2><p>Crie um projeto. Em cada projeto você escreve a pergunta, a hipótese e o contrafactual, e o Descartes confronta cada um com a literatura.</p><button class="b" data-act="newProject">Novo projeto</button></div>`; return; }
  if (ITEMS[S.view]) app.innerHTML = renderItem(p, S.view);
  else if (S.view==='literatura') app.innerHTML = renderLit(p);
}

/* ---------- Eventos (delegação) ---------- */
const ACTIONS = {};
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName!=='INPUT') ev.preventDefault();
  try { await fn(el, ev); } catch(e){ console.error(e); toast('Erro: '+e.message, 6000); }
});
document.addEventListener('input', ev => {
  const el = ev.target; const p = cur();
  if (el.dataset.bind && p){ setPath(p, el.dataset.bind, el.type==='number'? Number(el.value) : el.value); touch(p); if (el.dataset.rerender) debounceRender(); }
  if (el.dataset.bindp){ const pr=S.programs.find(x=>x.id===el.dataset.pid); if(pr){ setPath(pr, el.dataset.bindp, el.type==='number'?Number(el.value):el.value); pr.updatedAt=nowISO(); savePrograms(); } }
  if (el.dataset.cfg){ S.config[el.dataset.cfg] = el.type==='checkbox' ? el.checked : (el.type==='number'?Number(el.value):el.value); saveConfig(); }
});
document.addEventListener('change', ev => {
  const el = ev.target; const p = cur();
  if (el.id==='projSel'){ if (el.value==='__new') ACTIONS.newProject(); else { S.currentId=el.value; DB.put('kv', S.currentId, 'currentId'); render(); } return; }
  if (el.dataset.bindc && p){ setPath(p, el.dataset.bindc, el.type==='checkbox'?el.checked:el.value); touch(p); render(); }
  if (el.dataset.bindpc){ const pr=S.programs.find(x=>x.id===el.dataset.pid); if(pr){ setPath(pr, el.dataset.bindpc, el.value); pr.updatedAt=nowISO(); savePrograms(); render(); } }
  if (el.dataset.cfg && (el.type==='checkbox' || el.tagName==='SELECT')){ S.config[el.dataset.cfg] = el.type==='checkbox'?el.checked:el.value; saveConfig(); LLM.checkStatus(); }
  if (el.dataset.chg && ACTIONS[el.dataset.chg]) ACTIONS[el.dataset.chg](el, ev);
});
let rrT=null; function debounceRender(){ clearTimeout(rrT); rrT=setTimeout(()=>{ const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart; render(); if(id){ const n=document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos);}catch(e){} } } }, 700); }
function setPath(obj, path, val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; }
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o==null?undefined:o[k], obj); }

ACTIONS.view = el => { S.view = el.dataset.v; render(); window.scrollTo(0,0); };
ACTIONS.newProject = () => {
  const t = prompt('Nome do projeto (ex.: MRV — permanência da vegetação):'); if (!t) { renderNav(); return; }
  const p = newProject(t.trim()); S.projects.push(p); S.currentId=p.id; S.view='pergunta';
  DB.put('kv', p.id, 'currentId'); persist(p); render();
};
ACTIONS.renameProject = () => { const p=cur(); const t=prompt('Novo nome:', p.title); if(t){ p.title=t.trim(); touch(p); render(); } };
ACTIONS.deleteProject = async () => { const p=cur(); if(!confirm(`Excluir o projeto "${p.title}"? Exporte um backup antes.`)) return;
  await DB.del('projects', p.id); S.projects = S.projects.filter(x=>x.id!==p.id); S.currentId = S.projects[0]?.id || null; Sync.markDeleted(p.id); render(); };

/* ---------- Inicialização e migração da v0.1 ---------- */
async function boot(){
  await DB.open();
  const cfg = await DB.get('kv','config'); if (cfg){ S.config = {...DEFAULT_CONFIG, ...cfg}; if (['allowOpenRouter','openrouterKey','openrouterModel'].some(k=>k in S.config)){ for (const k of ['allowOpenRouter','openrouterKey','openrouterModel']) delete S.config[k]; await saveConfig(); } }
  S.projects = await DB.all('projects'); for (const p of S.projects) migrate(p);
  S.programs = (await DB.get('kv','programs')) || [];
  S.catalog = (await DB.get('kv','catalog')) || [];
  S.currentId = (await DB.get('kv','currentId')) || S.projects[0]?.id || null;
  if (!S.projects.find(p=>p.id===S.currentId)) S.currentId = S.projects[0]?.id || null;
  render();
  LLM.checkStatus().then(()=>render());
  setInterval(()=>{ if (!LLM.online) LLM.checkStatus().then(ok=>{ if (ok) render(); }); }, 20000);   // liga sozinho quando o Ollama subir
  Sync.init();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function migrate(p){
  const base = newProject(p.title);
  for (const k of Object.keys(base)) if (p[k]===undefined) p[k]=base[k];
  for (const k of Object.keys(base.items)) if (!p.items[k]) p.items[k]=base.items[k];
  for (const k of Object.keys(base.lit)) if (p.lit[k]===undefined) p.lit[k]=base.lit[k];
  // v0.1 → v0.2: aproveita textos dos estágios antigos (os dados antigos ficam guardados em p.stages)
  if (p.stages && !p.migratedV2){
    const f = s => p.stages?.[s]?.fields || {};
    if (!p.items.pergunta.fields.texto && f('s2').pergunta) p.items.pergunta.fields.texto = f('s2').pergunta;
    if (!p.items.contrafactual.fields.texto && (f('s5').seVerdadeira||f('s5').seFalsa||f('s5').controles))
      p.items.contrafactual.fields.texto = [f('s5').controles, f('s5').seVerdadeira && 'Se verdadeira: '+f('s5').seVerdadeira, f('s5').seFalsa && 'Se falsa: '+f('s5').seFalsa].filter(Boolean).join('\n');
    p.migratedV2 = true;
  }
}

/* ---- llm.js ---- */
/* ================= IA: cliente, crítico, fila ================= */
const LLM = {
  online:false, provider:null,
  async ollamaUp(){ try{ const r=await fetch(S.config.ollamaBase.replace(/\/$/,'')+'/api/tags',{signal:AbortSignal.timeout(2500)}); return r.ok; }catch(e){ return false; } },
  async checkStatus(){
    const el=$('#llmStatus'); const up = await LLM.ollamaUp();
    if (up){ LLM.online=true; LLM.provider='ollama'; el.className='pill ok'; el.textContent='IA: Qwen local'; }
    else { LLM.online=false; LLM.provider=null; el.className='pill'; el.textContent='IA: offline (fila)'; }
    return LLM.online;
  },
  stripThink(s){ return String(s||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim(); },
  parseJSON(s){ s=LLM.stripThink(s); try{ return JSON.parse(s); }catch(e){} const m=s.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} } throw new Error('Resposta da IA não é JSON válido'); },
  async chat({system, user, schema, temperature}){
    if (!LLM.online) await LLM.checkStatus();
    if (!LLM.online) throw new Error('IA indisponível');
    const temp = temperature ?? S.config.temperature;
    {
      const r = await fetch(S.config.ollamaBase.replace(/\/$/,'')+'/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:S.config.ollamaModel, stream:false, think:false, format:schema||'json', options:{temperature:temp, num_ctx:8192},
          messages:[{role:'system',content:system},{role:'user',content:user}]})});
      if (!r.ok) throw new Error('Ollama: HTTP '+r.status+' '+(await r.text()).slice(0,200));
      const j = await r.json(); return LLM.parseJSON(j.message?.content);
    }
  },
  /* Chamada com validação e até 2 novas tentativas */
  async chatValid(opts, validate){
    let lastErr;
    for (let i=0;i<3;i++){ try{ const out=await LLM.chat(opts); const err=validate?validate(out):null; if(!err) return out; lastErr=new Error('Formato inválido: '+err); }catch(e){ lastErr=e; if(String(e.message).includes('indisponível')) throw e; } }
    throw lastErr;
  },
  async embed(texts){
    if (!(await LLM.ollamaUp())) throw new Error('Embeddings exigem o Ollama no PC');
    const r = await fetch(S.config.ollamaBase.replace(/\/$/,'')+'/api/embed', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({model:S.config.embedModel, input:texts})});
    if (!r.ok) throw new Error('Ollama embed: HTTP '+r.status+' '+(await r.text()).slice(0,200));
    return (await r.json()).embeddings;
  },
};


/* ---- lit.js ---- */
/* ================= Literatura em escala (6.1) e auditoria da lacuna (6.2) ================= */
const LIT_TABS = [['fontes','Corpus e buscas'],['triagem','Triagem'],['extracao','Extração'],['validacao','Validação'],['sintese','Síntese'],['nucleo','Núcleo']];
const included = p => p.lit.records.filter(r => r.override ? r.override==='incluir' : (r.triage && r.triage.dec!=='excluir'));
const recById = (p,id) => p.lit.records.find(r=>r.id===id);
const normDoi = d => String(d||'').toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//,'').replace(/^doi:\s*/,'').trim();
const normTitle = t => normTxt(t).replace(/[^a-z0-9à-ú]+/g,'');
function gapDeclared(p){ const g=p.lit.gap; return !!g.declared && g.declaredHash===hashStr(g.claim||''); }

/* ---------- Registro e deduplicação ---------- */
function addRecords(p, recs, sourceName){
  let novos=0; const idxDoi={}, idxT={};
  for (const r of p.lit.records){ if(r.doi) idxDoi[r.doi]=r; idxT[normTitle(r.title)+'|'+(r.year||'')]=r; }
  for (const raw of recs){
    if (!raw.title) continue;
    const r = {title:String(raw.title).trim(), abstract:String(raw.abstract||'').trim(), doi:normDoi(raw.doi), year:raw.year?Number(String(raw.year).slice(0,4))||null:null,
      authors:raw.authors||'', venue:raw.venue||'', openalexId:raw.openalexId||'', s2Id:raw.s2Id||'', refs:raw.refs||[], citedBy:raw.citedBy||0, link:raw.link||''};
    const ex = (r.doi && idxDoi[r.doi]) || idxT[normTitle(r.title)+'|'+(r.year||'')];
    if (ex){ if(!ex.abstract && r.abstract){ ex.abstract=r.abstract; ex.sem_resumo=false; } if(!ex.openalexId && r.openalexId){ ex.openalexId=r.openalexId; ex.refs=r.refs; } if(!ex.s2Id && r.s2Id) ex.s2Id=r.s2Id;
      ex.citedBy=Math.max(ex.citedBy||0, r.citedBy||0); if(!ex.sources.includes(sourceName)) ex.sources.push(sourceName); continue; }
    const rec = {id:uid('r'), ...r, sources:[sourceName], sem_resumo:!r.abstract, addedAt:nowISO()};
    p.lit.records.push(rec); novos++; if(rec.doi) idxDoi[rec.doi]=rec; idxT[normTitle(rec.title)+'|'+(rec.year||'')]=rec;
  }
  return novos;
}

/* ---------- OpenAlex ---------- */
function oaAbstract(inv){ if(!inv) return ''; const arr=[]; for (const [w,pos] of Object.entries(inv)) for (const i of pos) arr[i]=w; return arr.filter(x=>x!==undefined).join(' '); }
function oaMap(w){ return { title:w.title||w.display_name, abstract:oaAbstract(w.abstract_inverted_index), doi:w.doi, year:w.publication_year,
  authors:(w.authorships||[]).slice(0,6).map(a=>a.author?.display_name).filter(Boolean).join('; '), venue:w.primary_location?.source?.display_name||'',
  openalexId:(w.id||'').replace('https://openalex.org/',''), refs:(w.referenced_works||[]).map(x=>x.replace('https://openalex.org/','')), citedBy:w.cited_by_count||0 }; }
function oaUrl(params){ const u=new URL('https://api.openalex.org/works'); for(const [k,v] of Object.entries(params)) u.searchParams.set(k,v);

async function oaGet(params){ const r=await fetch(oaUrl(params)); if(!r.ok) throw new Error('OpenAlex HTTP '+r.status+': '+(await r.text()).slice(0,160)); return r.json(); }

async function s2Fetch(url, opt={}){

/* ---------- Importação CSV / RIS / WoS ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,''); const first=text.split(/\r?\n/,1)[0];
  const sep = [',',';','\t'].map(s=>[s, first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if (ch==='"') q=true; else if (ch===sep){ row.push(f); f=''; } else if (ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=ch; }
  if (f.length||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseRIS(text){ const out=[]; let r=null;
  for (const line of text.split(/\r?\n/)){ const m=line.match(/^([A-Z][A-Z0-9])  -\s?(.*)$/); if(!m){ continue; } const [,tag,val]=m;
    if (tag==='TY'){ r={authors:[]}; continue; } if (!r) continue; if (tag==='ER'){ r.authors=r.authors.join('; '); out.push(r); r=null; continue; }
    if ((tag==='TI'||tag==='T1') && !r.title) r.title=val; else if (tag==='AB'||tag==='N2') r.abstract=(r.abstract?r.abstract+' ':'')+val; else if (tag==='DO') r.doi=val;
    else if ((tag==='PY'||tag==='Y1'||tag==='DA') && !r.year) r.year=val.slice(0,4); else if (tag==='AU'||tag==='A1') r.authors.push(val); else if ((tag==='JO'||tag==='T2'||tag==='JF') && !r.venue) r.venue=val; else if (tag==='UR' && !r.link) r.link=val; }
  return out; }
function mapTable(rows){
  const H=rows[0].map(h=>h.trim().toLowerCase()); const find=(...names)=>H.findIndex(h=>names.includes(h));
  const ix={title:find('title','article title','ti','document title'), abstract:find('abstract','ab'), doi:find('doi','di'), year:find('year','publication year','py'),
    authors:find('authors','author full names','au','author names'), venue:find('journal','source title','so','source','publication title'), link:find('consensus link','link','url')};
  let fonte='Importação', tipo='termos';
  if (H.includes('takeaway')||H.includes('consensus link')){ fonte='Consensus'; tipo='exploratória'; }
  else if (H.includes('eid')) fonte='Scopus'; else if (H.includes('ut')&&H.includes('pt')) fonte='Web of Science';
  const recs = rows.slice(1).map(r=>{ const o={}; for (const [k,i] of Object.entries(ix)) if(i>=0) o[k]=(r[i]||'').trim(); return o; });
  return {recs, fonte, tipo, dropped: H.includes('takeaway')?['Takeaway (gerada por IA)']:[]};
}
ACTIONS.importFile = async () => {
  const p=cur(); const fi=$('#impFile'); const q=$('#impQ').value.trim(); const tipoSel=$('#impTipo').value;
  if (!fi.files.length) return toast('Escolha o arquivo.'); if (!q) return toast('Informe a consulta ou pergunta usada na busca (vai para o registro).');

/* ---------- Execução em lote ---------- */
async function runBatch(key, items, fn){
  if (S.busy[key]) return; const b = S.busy[key] = {done:0, total:items.length, stop:false, errors:0}; render(); let last=0;
  for (const it of items){ if (b.stop) break; try{ await fn(it); }catch(e){ b.errors++; console.warn(e); if(String(e.message).includes('indisponível')){ toast('IA indisponível — lote interrompido.'); break; } }
    b.done++; touch(); if (Date.now()-last>1000){ last=Date.now(); if (S.view==='literatura') render(); } }
  delete S.busy[key]; touch(); render(); toast(`Lote concluído: ${b.done}/${b.total}${b.errors?`, ${b.errors} erro(s)`:''}.`);
}
const progress = key => { const b=S.busy[key]; if(!b) return ''; return `<div class="row" style="margin:6px 0"><div class="progress" style="flex:1"><div style="width:${(100*b.done/Math.max(1,b.total)).toFixed(1)}%"></div></div><span class="small">${b.done}/${b.total}</span><button class="b sec" data-act="stopBatch" data-k="${key}">Parar</button></div>`; };
ACTIONS.stopBatch = el => { if (S.busy[el.dataset.k]) S.busy[el.dataset.k].stop=true; };

/* ---------- Triagem ---------- */
const triageSchema = {type:'object', required:['decisao','trecho','motivo'], properties:{decisao:{type:'string',enum:['incluir','excluir','duvida']}, trecho:{type:'string'}, motivo:{type:'string'}}};
async function triageOne(p, r){
  const src = r.title+'\n'+(r.abstract||'');
  const out = await LLM.chatValid({system:`Você faz triagem de literatura científica para um pesquisador. Aplique SOMENTE os critérios dele. "trecho": cópia literal de até 160 caracteres do título ou resumo que justifica a decisão. Na dúvida, use "duvida". Responda em português.`,
    user:`CRITÉRIOS DE INCLUSÃO E EXCLUSÃO:\n${p.lit.criteria}\n\nTÍTULO: ${r.title}\nRESUMO: ${r.abstract||'(sem resumo)'}`, schema:triageSchema},
    o=>['incluir','excluir','duvida'].includes(o.decisao)?null:'decisao');
  const ok = quoteOK(out.trecho, src); let dec=out.decisao;
  if (dec==='excluir' && !ok) dec='duvida';
  r.triage={dec, trecho:out.trecho, motivo:out.motivo, ok, by:'ia', critHash:hashStr(p.lit.criteria)};
}
ACTIONS.runTriage = () => { const p=cur(); if (p.lit.criteria.trim().length<30) return toast('Escreva os critérios de inclusão e exclusão primeiro.');
  const h=hashStr(p.lit.criteria); const todo=p.lit.records.filter(r=>!r.override && (!r.triage || (r.triage.by==='ia' && r.triage.critHash!==h)));
  if(!todo.length) return toast('Nada pendente de triagem.'); runBatch('triage', todo, r=>triageOne(p,r)); };

/* ---------- Extração ---------- */
const schemaHash = p => hashStr(JSON.stringify(p.lit.schema.map(f=>[f.id,f.nome,f.desc,f.tipo])));
async function extractOne(p, r){
  const props={}; for (const f of p.lit.schema) props[f.id]={type:'object', required:['valor','trecho'], properties:{valor:{type:'string'}, trecho:{type:'string'}}};
  const schema={type:'object', required:['campos'], properties:{campos:{type:'object', required:p.lit.schema.map(f=>f.id), properties:props}}};
  const src=r.title+'\n'+(r.abstract||'');
  const out = await LLM.chatValid({system:`Você extrai dados de artigos científicos para uma tabela. Use SOMENTE o título e o resumo fornecidos. Para cada campo: "valor" curto (para campos categóricos, um rótulo de poucas palavras); "trecho" = cópia literal de até 160 caracteres que sustenta o valor. Se a informação não estiver no texto, valor "não informado" e trecho "". Nunca deduza além do texto.`,
    user:`CAMPOS:\n${p.lit.schema.map(f=>`- ${f.id} (${f.tipo}): ${f.nome}${f.desc?' — '+f.desc:''}`).join('\n')}\n\nTÍTULO: ${r.title}\nRESUMO: ${r.abstract||'(sem resumo)'}`, schema},
    o=>o.campos && p.lit.schema.every(f=>o.campos[f.id])?null:'campos');
  const ex={};
  for (const f of p.lit.schema){ const c=out.campos[f.id]; const ni = !c.valor || /^n[aã]o informado$/i.test(c.valor.trim());
    const ok = !ni && quoteOK(c.trecho, src);
    ex[f.id] = ok ? {valor:c.valor.trim(), trecho:c.trecho, ok:true} : {valor:'não informado', trecho:'', ok:false, descartado: ni?null:c.valor}; }
  r.extract={schemaHash:schemaHash(p), campos:ex};
}
ACTIONS.addField = () => { const p=cur(); if (p.lit.validation.locked && !confirm('Alterar o esquema invalida a validação já feita. Continuar?')) return; resetValidation(p);
  p.lit.schema.push({id:'f'+(p.lit.schema.length+1)+'_'+Math.random().toString(36).slice(2,5), nome:'', desc:'', tipo:'categorico'}); touch(p); render(); };
ACTIONS.delField = el => { const p=cur(); if (p.lit.validation.locked && !confirm('Alterar o esquema invalida a validação já feita. Continuar?')) return; resetValidation(p); p.lit.schema.splice(Number(el.dataset.i),1); touch(p); render(); };
function resetValidation(p){ p.lit.validation={threshold:p.lit.validation.threshold, locked:false, sample:[], manual:{}, equiv:{}, done:false}; }
ACTIONS.runExtract = () => { const p=cur(); if(!p.lit.schema.length || p.lit.schema.some(f=>!f.nome.trim())) return toast('Defina os campos (com nome) primeiro.');
  const h=schemaHash(p); const todo=included(p).filter(r=>!r.extract || r.extract.schemaHash!==h); if(!todo.length) return toast('Nada pendente de extração.');
  runBatch('extract', todo, r=>extractOne(p,r)); };

/* ---------- Validação (codificação cega + kappa) ---------- */
const normVal = v => { const s=normTxt(v||''); return (!s || /^n[aã]o informado$/.test(s)) ? 'não informado' : s; };
function cohenKappa(a, b){ const n=a.length; if(!n) return null; let agree=0; const ca={}, cb={};
  for (let i=0;i<n;i++){ if(a[i]===b[i]) agree++; ca[a[i]]=(ca[a[i]]||0)+1; cb[b[i]]=(cb[b[i]]||0)+1; }
  const po=agree/n; let pe=0; for (const l of new Set([...a,...b])) pe+=((ca[l]||0)/n)*((cb[l]||0)/n);
  return pe>=1 ? (po===1?1:0) : (po-pe)/(1-pe); }
function validationResults(p){
  const v=p.lit.validation; const res={};
  for (const f of p.lit.schema){ const A=[],B=[]; let pendingEquiv=0;
    for (const rid of v.sample){ const r=recById(p,rid); if(!r?.extract) continue; const m=v.manual[rid]?.[f.id]; if(m===undefined) continue;
      let ia=normVal(r.extract.campos[f.id]?.valor), eu=normVal(m);
      if (ia!==eu){ const k=rid+'|'+f.id; if (v.equiv[k]===true) eu=ia; else if (v.equiv[k]===undefined && f.tipo==='texto') pendingEquiv++; }
      A.push(ia); B.push(eu); }
    const n=A.length; const agree=n?A.filter((x,i)=>x===B[i]).length/n:null; const kappa=f.tipo==='categorico'?cohenKappa(A,B):null;
    const metric = f.tipo==='categorico' ? kappa : agree; res[f.id]={n, agree, kappa, pendingEquiv, pass: metric!==null && metric>=v.threshold && pendingEquiv===0}; }
  return res;
}
const usableFields = p => { const v=p.lit.validation; if(!v.done) return p.lit.schema; const res=validationResults(p); return p.lit.schema.filter(f=>res[f.id]?.pass); };
ACTIONS.drawSample = () => { const p=cur(); const pool=included(p).filter(r=>r.extract && r.extract.schemaHash===schemaHash(p)); if (pool.length<5) return toast('Extraia os dados primeiro (mínimo de 5 artigos).');
  const arr=[...pool]; for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  const v=p.lit.validation; v.sample=arr.slice(0,30).map(r=>r.id); v.locked=true; v.manual={}; v.equiv={}; v.done=false; v.lockedAt=nowISO();
  logDiary(p,{stageId:'s1', stageName:'Literatura', kind:'validação', text:`Amostra de ${v.sample.length} artigos sorteada; limiar fixado em ${v.threshold}.`}); touch(p); render(); };
ACTIONS.equiv = el => { const p=cur(); p.lit.validation.equiv[el.dataset.k] = el.dataset.v==='1'; touch(p); render(); };
ACTIONS.finishValidation = () => { const p=cur(); const v=p.lit.validation; const res=validationResults(p);
  const coded = v.sample.filter(id=>p.lit.schema.every(f=>v.manual[id]?.[f.id]!==undefined)).length;
  if (coded < v.sample.length) return toast(`Faltam ${v.sample.length-coded} artigos para codificar.`);
  if (Object.values(res).some(r=>r.pendingEquiv)) return toast('Julgue as equivalências pendentes dos campos de texto.');
  v.done=true; v.doneAt=nowISO(); logDiary(p,{stageId:'s1', stageName:'Literatura', kind:'validação', text:'Validação concluída: '+p.lit.schema.map(f=>`${f.nome} ${res[f.id].pass?'aprovado':'reprovado'}`).join('; ')}); touch(p); render(); };

/* ---------- Embeddings, grupos e núcleo ---------- */
async function getEmb(p){ return (await DB.get('kv','emb:'+p.id)) || {model:'', vecs:{}}; }
function unit(v){ let n=0; for (const x of v) n+=x*x; n=Math.sqrt(n)||1; return Float32Array.from(v, x=>x/n); }
const dot=(a,b)=>{ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; };
ACTIONS.embedAll = async () => {
  const p=cur(); const E=await getEmb(p); if (E.model!==S.config.embedModel){ E.model=S.config.embedModel; E.vecs={}; }
  const todo=included(p).filter(r=>!E.vecs[r.id]); if(!todo.length) return toast('Embeddings já calculados.');
  const batches=[]; for (let i=0;i<todo.length;i+=16) batches.push(todo.slice(i,i+16));
  await runBatch('embed', batches, async b=>{ const vs=await LLM.embed(b.map(r=>(r.title+'. '+(r.abstract||'')).slice(0,2000))); b.forEach((r,i)=>E.vecs[r.id]=unit(vs[i])); });
  await DB.put('kv', E, 'emb:'+p.id); render();
};
function seededRand(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function kmeans(ids, vecs, k){
  const rand=seededRand(42); const X=ids.map(id=>vecs[id]); const cents=[X[Math.floor(rand()*X.length)]];
  while (cents.length<k){ const d=X.map(x=>Math.max(0,1-Math.max(...cents.map(c=>dot(x,c))))); const tot=d.reduce((a,b)=>a+b,0)||1; let t=rand()*tot, i=0; for(;i<d.length-1;i++){ t-=d[i]; if(t<=0) break; } cents.push(X[i]); }
  let assign=new Array(X.length).fill(0);
  for (let it=0; it<30; it++){ let ch=0; X.forEach((x,i)=>{ let best=0,bs=-2; cents.forEach((c,j)=>{ const s=dot(x,c); if(s>bs){bs=s;best=j;} }); if(assign[i]!==best){assign[i]=best;ch++;} });
    for (let j=0;j<k;j++){ const mem=X.filter((_,i)=>assign[i]===j); if(!mem.length) continue; const m=new Float32Array(mem[0].length); mem.forEach(v=>v.forEach((x,d)=>m[d]+=x)); cents[j]=unit(m); }
    if(!ch && it) break; }
  return {assign:Object.fromEntries(ids.map((id,i)=>[id,assign[i]])), cents};
}
const STOP=new Set('a an the of in on for and or to with by from as at is are was were be using use based study analysis via its their this that these than into between over under new approach data de da do das dos e em para com por uma um os as no na nos nas ao à se que entre sobre'.split(' '));
function clusterLabels(p, assign, k){
  const docs={}; const df={}; const recs=included(p).filter(r=>assign[r.id]!==undefined);
  for (const r of recs){ const toks=[...new Set(normTxt(r.title).split(/[^a-zà-ú0-9-]+/).filter(t=>t.length>3&&!STOP.has(t)))]; docs[r.id]=toks; toks.forEach(t=>df[t]=(df[t]||0)+1); }
  const labels=[]; for (let j=0;j<k;j++){ const tf={}; let n=0; recs.filter(r=>assign[r.id]===j).forEach(r=>{ n++; docs[r.id].forEach(t=>tf[t]=(tf[t]||0)+1); });
    const sc=Object.entries(tf).map(([t,c])=>[t,(c/Math.max(1,n))*Math.log(recs.length/(df[t]))]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]); labels.push(sc.join(', ')); }
  return labels;
}
ACTIONS.cluster = async () => { const p=cur(); const E=await getEmb(p); const ids=included(p).map(r=>r.id).filter(id=>E.vecs[id]);
  if (ids.length<10) return toast('Calcule os embeddings primeiro (mínimo de 10 artigos).'); const k=Math.max(2,Math.min(20,Number(p.lit.k)||6));
  const {assign,cents}=kmeans(ids,E.vecs,k); p.lit.clusters={k, assign, labels:clusterLabels(p,assign,k), summaries:{}, at:nowISO()}; E.cents=cents; await DB.put('kv',E,'emb:'+p.id); touch(p); render(); };
ACTIONS.summarizeCluster = async el => {
  const p=cur(); const j=Number(el.dataset.j); const E=await getEmb(p); const C=p.lit.clusters; const mem=included(p).filter(r=>C.assign[r.id]===j);
  const cen=E.cents?.[j]; const top = cen ? [...mem].sort((a,b)=>dot(E.vecs[b.id],cen)-dot(E.vecs[a.id],cen)).slice(0,25) : mem.slice(0,25);
  const code=new Map(top.map((r,i)=>['A'+(i+1), r.id]));
  S.busy['sum_'+j]=true; render();
  try{

      user:[...code.entries()].map(([c,id])=>{ const r=recById(p,id); return `${c}: ${r.title} (${r.year||'s.d.'}). ${(r.abstract||'(sem resumo)').slice(0,600)}`; }).join('\n\n'),
      schema:{type:'object',required:['frases'],properties:{frases:{type:'array',items:{type:'object',required:['texto','ids'],properties:{texto:{type:'string'},ids:{type:'array',items:{type:'string'}}}}}}}},
      o=>Array.isArray(o.frases)?null:'frases');
    C.summaries[j]=out.frases.map(f=>({texto:f.texto, ids:(f.ids||[]).filter(c=>code.has(c)).map(c=>code.get(c))})).filter(f=>f.ids.length);
  }catch(e){ toast(e.message,6000); }
  delete S.busy['sum_'+j]; touch(p); render();
};
async function coreRanking(p){
  const inc=included(p); const cites={};
  const need=inc.filter(r=>r.s2Id && !r.s2refs);
  for (let i=0;i<need.length;i+=400){ const ch=need.slice(i,i+400);
    try{ const j=await s2Fetch('https://api.semanticscholar.org/graph/v1/paper/batch?fields=references.paperId',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids:ch.map(r=>r.s2Id)})});
      j.forEach((x,k)=>{ ch[k].s2refs=(x?.references||[]).map(y=>y.paperId).filter(Boolean); }); }catch(e){ toast('Rede de citações: '+e.message, 6000); break; } }
  const key = r => r.s2Id || r.openalexId; const ids=new Set(inc.map(key).filter(Boolean));
  for (const r of inc) for (const ref of [...(r.s2refs||[]), ...(r.refs||[])]) if (ids.has(ref)) cites[ref]=(cites[ref]||0)+1;
  const E=await getEmb(p); let qv=null;
  const qtext = (p.items.pergunta.fields.texto||'')+' '+(p.items.hipotese.fields.texto||'');
  if (Object.keys(E.vecs).length && qtext.trim().length>20){ try{ qv=unit((await LLM.embed([qtext]))[0]); }catch(e){} }
  const rows=inc.map(r=>({r, c:(cites[r.s2Id]||0)+(cites[r.openalexId]||0), g:r.citedBy||0, s: qv&&E.vecs[r.id]?dot(qv,E.vecs[r.id]):null}));
  const pct=(arr,key)=>{ const v=arr.map(x=>x[key]??-1); const sorted=[...v].sort((a,b)=>a-b); return x=>sorted.filter(y=>y<(x[key]??-1)).length/Math.max(1,sorted.length-1); };
  const pc=pct(rows,'c'), pg=pct(rows,'g'), ps=pct(rows,'s');
  rows.forEach(x=>x.score = qv ? 0.4*pc(x)+0.1*pg(x)+0.5*ps(x) : 0.8*pc(x)+0.2*pg(x));
  return {rows:rows.sort((a,b)=>b.score-a.score).slice(0,30), usedSim:!!qv};
}
ACTIONS.computeCore = async () => { const p=cur(); const {rows,usedSim}=await coreRanking(p); p.lit.core=rows.map(x=>({id:x.r.id, c:x.c, s:x.s, score:x.score})); p.lit.coreSim=usedSim; touch(p); render(); };

const gapSchema={type:'object',required:['classe','trecho','motivo'],properties:{classe:{type:'string',enum:['ja_responde','em_parte','nao_responde']},trecho:{type:'string'},motivo:{type:'string'}}};
async function gapOne(p, r){

  const out=await LLM.chatValid({system:'Você verifica se um artigo já responde à lacuna de pesquisa afirmada por um pesquisador. Use SOMENTE o título e o resumo. "ja_responde": o estudo responde a lacuna; "em_parte": responde parte ou em outro contexto; "nao_responde": não trata dela. "trecho": cópia literal de até 160 caracteres que justifica. Português.',
    user:`LACUNA AFIRMADA:\n${p.lit.gap.claim}\n\nTÍTULO: ${r.title}\nRESUMO: ${r.abstract||'(sem resumo)'}`, schema:gapSchema}, o=>['ja_responde','em_parte','nao_responde'].includes(o.classe)?null:'classe');

ACTIONS.runGap = () => { const p=cur(); if((p.lit.gap.claim||'').trim().length<30) return toast('Escreva a afirmação de lacuna (uma frase completa).');

function gapConditions(p){
  const g=p.lit.gap, h=hashStr(g.claim||''), c=[];
  if ((g.claim||'').trim().length<30) c.push('Escreva a afirmação de lacuna.');
  if (!p.lit.searches.some(s=>s.tipo==='termos')) c.push('Falta ao menos uma busca reproduzível por termos (Semantic Scholar, Scopus, Web of Science ou OpenAlex).');
  const inc=included(p); if (!inc.length) c.push('Nenhum artigo incluído na triagem.');
  const notCls=inc.filter(r=>!r.gap||r.gap.claimHash!==h).length; if (notCls) c.push(`${notCls} artigo(s) incluídos ainda não classificados contra a lacuna.`);
  const rl=readingList(p); const und=rl.filter(r=>g.decisions[r.id]?.claimHash!==h).length; if (und) c.push(`${und} artigo(s) da lista de leitura sem decisão.`);
  if (rl.some(r=>g.decisions[r.id]?.claimHash===h && g.decisions[r.id].v==='refuta')) c.push('Há artigo que refuta a lacuna: reformule a afirmação.');

}

/* ---------- Semantic Scholar bulk ---------- */
async function s2Bulk(query, max, extra=''){
  const out=[]; let token=null, total=null;
  do { const u=`https://api.semanticscholar.org/graph/v1/paper/search/bulk?query=${encodeURIComponent(query)}&fields=${S2F}${extra}${token?'&token='+encodeURIComponent(token):''}`;
    const j=await s2Fetch(u); total=j.total; out.push(...(j.data||[]).map(s2Map)); token=j.token; if (token && out.length<max) await sleep(1100);
  } while (token && out.length<max);
  return {total, data:out.slice(0,max)};
}

/* ---------- Análise ---------- */
function setStep(key, msg, done, total){ S.busy['an_'+key]={...(S.busy['an_'+key]||{}), msg, done, total}; if (S.view===key) render(); }
const stopped = key => S.busy['an_'+key]?.stop;
ACTIONS.stopAnalysis = el => { const b=S.busy['an_'+el.dataset.k]; if(b) b.stop=true; };

async function analyzeItem(p, key){
  const def=ITEMS[key]; const text=itemText(p, key); const it=p.items[key];
  if (S.busy['an_'+key]) return;
  if (text.length<20) return toast('Escreva o item antes de analisar.');
  S.busy['an_'+key]={msg:'Preparando…'}; render();
  if (!(await LLM.checkStatus()) || LLM.provider!=='ollama'){ delete S.busy['an_'+key]; render(); return toast('A análise usa o Qwen e os embeddings no PC: abra o Descartes no computador com o Ollama ligado.', 7000); }
  const k=Math.max(10, Math.min(300, Number(S.config.k)||100)); const per=Math.max(50, Math.min(2000, Number(S.config.perQuery)||300));
  const A={id:uid('a'), at:nowISO(), textHash:hashStr(text), ck:key+'|'+hashStr(text)+'|c2', model:S.config.ollamaModel, text, k, queries:[], totals:[], criteria:[], summary:[], top:[], warnings:[]};
  const t0=Date.now(); S.busy['an_'+key].t0=t0;
  const tick=setInterval(()=>{ const el=document.getElementById('anTimer'); if (el) el.textContent=fmtDur((Date.now()-t0)/1000); }, 1000);
  try{
    /* 1. Consultas: as suas, se você escreveu; senão o Qwen propõe */
    let queries = (it.queries||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if (!queries.length){
      setStep(key,'Gerando consultas de busca…');
      const B=await buildQueries(key, text, m=>setStep(key,m)); it.concepts=B.blocks; storeQueries(it, B.list); queries=B.list.map(x=>x.consulta);
    }
    A.queries=queries;
    /* 2. Busca e acúmulo no corpus do projeto */
    for (const [i,q] of queries.entries()){
      if (stopped(key)) throw new Error('interrompida');
      setStep(key,`Buscando no Semantic Scholar (${i+1}/${queries.length})…`);
      try{ const r=await s2Bulk(q, per); const novos=addRecords(p, r.data, 'Semantic Scholar');
        logSearch(p,{fonte:'Semantic Scholar (bulk)', consulta:q, tipo:'termos', n:r.data.length, novos, total:r.total, item:key}); A.totals.push({q, total:r.total, got:r.data.length, novos}); }
      catch(e){ A.warnings.push(`Busca "${q}" falhou: ${e.message}. A análise usa o corpus já existente.`); }
      await sleep(1100);
    }
    /* 3. Embeddings e ordenação por proximidade */
    const E=await getEmb(p); if (E.model!==S.config.embedModel){ E.model=S.config.embedModel; E.vecs={}; }
    const cand=p.lit.records.filter(r=>r.abstract && r.override!=='excluir');
    const todo=cand.filter(r=>!E.vecs[r.id]);
    for (let i=0;i<todo.length;i+=32){ if (stopped(key)) throw new Error('interrompida');
      setStep(key,'Calculando embeddings…', i, todo.length);
      const b=todo.slice(i,i+32); const vs=await LLM.embed(b.map(r=>(r.title+'. '+r.abstract).slice(0,2000))); b.forEach((r,j)=>E.vecs[r.id]=unit(vs[j])); }
    await DB.put('kv', E, 'emb:'+p.id);
    const qv=unit((await LLM.embed([text]))[0]);
    const ranked=cand.map(r=>({r, s:dot(qv,E.vecs[r.id])})).sort((a,b)=>b.s-a.s);
    const top=ranked.slice(0,k); A.corpusN=cand.length; A.semResumo=p.lit.records.filter(r=>!r.abstract).length;
    if (top.length<k) A.warnings.push(`O corpus tem só ${top.length} artigos com resumo; a análise leu todos.`);
    /* 4. Leitura dos k mais próximos (com cache por versão do item) */
    const ck=A.ck;
    for (const [i,x] of top.entries()){
      if (stopped(key)) throw new Error('interrompida');
      setStep(key,`Lendo os artigos mais próximos (${i+1}/${top.length})…`, i, top.length);
      const r=x.r; r.cls ||= {};
      if (!r.cls[ck]){
        const src=r.title+'\n'+r.abstract;
        const o=await LLM.chatValid({system:`Você compara um artigo científico com um item de pesquisa. Use SOMENTE o título e o resumo. "ja_responde": ${def.cls}; "em_parte": trata do mesmo problema, mas em outro contexto, com outra abordagem ou só em parte; "nao_responde": é do mesmo tema geral do item (mesmo objeto, fator ou contexto), mas não trata do problema que o item investiga; "fora_do_tema": não é do tema do item (outro objeto, outro fenômeno ou outra área), mesmo que compartilhe palavras. "trecho": cópia literal de até 160 caracteres do resumo que justifica. Português.`,
          user:`ITEM (${def.name}):\n${text}\n\nTÍTULO: ${r.title}\nRESUMO: ${r.abstract}`, schema:{type:'object',required:['classe','trecho'],properties:{classe:{type:'string',enum:['ja_responde','em_parte','nao_responde','fora_do_tema']},trecho:{type:'string'}}}},
          o=>['ja_responde','em_parte','nao_responde','fora_do_tema'].includes(o.classe)?null:'classe');
        const ok=quoteOK(o.trecho, src);
        r.cls[ck]={classe: (!ok && (o.classe==='ja_responde'||o.classe==='em_parte')) ? 'em_parte' : o.classe, trecho:o.trecho, ok};
      }
      A.top.push({id:r.id, s:+x.s.toFixed(3), classe:r.cls[ck].classe});
      if (i%10===9) touch(p);
    }
    /* 5. Índice de sobreposição/novidade e saturação */
    const ind = n => { const sl=A.top.slice(0,n), on=sl.filter(t=>t.classe!=='fora_do_tema'); const ja=on.filter(t=>t.classe==='ja_responde').length, pa=on.filter(t=>t.classe==='em_parte').length;
      return {n:sl.length, on:on.length, fora:sl.length-on.length, ja, pa, idx: on.length? Math.round(100*(1-(ja+0.5*pa)/on.length)) : null}; };
    A.sat=[15,50,A.top.length].filter((n,i,a)=>n<=A.top.length && a.indexOf(n)===i).map(ind);
    const all=ind(A.top.length); A.novelty=all.idx; A.onTopic=all.on; A.foraN=all.fora;
    if (all.fora > all.n/2) A.warnings.push(`Busca imprecisa: ${all.fora} dos ${all.n} artigos lidos estão fora do tema. O índice foi calculado só sobre os ${all.on} do tema e é pouco confiável; revise as consultas.`);
    if (all.on < Math.min(10, Math.ceil(all.n/2))) A.warnings.push(`Só ${all.on} artigos do tema entre os lidos: amostra pequena para medir a novidade.`);
    const tail=A.top.slice(Math.floor(A.top.length*2/3)); A.saturou = !tail.some(t=>t.classe==='ja_responde');
    if (!A.saturou) A.warnings.push('Ainda aparecem artigos que já respondem ao item no último terço da lista: aumente o número de artigos lidos ou revise as consultas.');
    /* 6. Cartões por critério (um critério por chamada) */
    const evid = () => { const rel=A.top.filter(t=>t.classe==='ja_responde'||t.classe==='em_parte').slice(0,8); const rest=A.top.filter(t=>t.classe==='nao_responde').slice(0,12-rel.length);
      return [...rel,...rest].map((t,i)=>({code:'A'+(i+1), r:recById(p,t.id), classe:t.classe})); };
    for (const [i,c] of def.criteria.entries()){
      if (stopped(key)) throw new Error('interrompida');
      setStep(key,`Avaliando critérios (${i+1}/${def.criteria.length}): ${c.t}…`);
      A.criteria.push(await evalCriterion(p, key, c, text, A, evid));
      touch(p);
    }
    /* 7. Resumo da literatura (hierárquico, em blocos de 20) */
    const blocks=[]; for (let i=0;i<A.top.length;i+=20) blocks.push(A.top.slice(i,i+20));
    const partial=[];
    for (const [bi,b] of blocks.entries()){
      if (stopped(key)) throw new Error('interrompida');
      setStep(key,`Resumindo a literatura (bloco ${bi+1}/${blocks.length})…`);
      const codes=b.map((t,j)=>['R'+(bi*20+j+1), t.id]);
      const o=await LLM.chatValid({system:'Resuma o que este conjunto de artigos diz sobre o item, em 2 a 3 frases objetivas (dados, métodos, achados, limites). Cada frase deve listar em "ids" os códigos (R…) dos artigos que a sustentam. Não afirme nada que os resumos não digam. Português.',
        user:`ITEM:\n${text}\n\n`+codes.map(([c,id])=>{const r=recById(p,id); return `${c}: ${r.title} (${r.year||'s.d.'}). ${(r.abstract||'').slice(0,450)}`;}).join('\n\n'), schema:frasesSchema}, o=>Array.isArray(o.frases)?null:'frases');
      const valid=new Map(codes); partial.push(...o.frases.map(f=>({texto:f.texto, ids:(f.ids||[]).filter(c=>valid.has(c))})).filter(f=>f.ids.length));
    }
    setStep(key,'Consolidando o resumo…');
    const codeMap=new Map(A.top.map((t,i)=>['R'+(i+1), t.id]));
    if (partial.length){
      const o=await LLM.chatValid({system:'Consolide as frases abaixo num resumo de 4 a 6 frases sobre o estado da literatura em relação ao item: o que já se sabe, como se estuda e o que falta. Mantenha em "ids" apenas códigos R… presentes nas frases de origem. Português.',
        user:`ITEM:\n${text}\n\nFRASES:\n`+partial.map(f=>`- ${f.texto} [${f.ids.join(', ')}]`).join('\n'), schema:frasesSchema}, o=>Array.isArray(o.frases)?null:'frases');
      A.summary=o.frases.map(f=>({texto:decode(f.texto, c=>codeMap.has(c)?recById(p,codeMap.get(c)):null), ids:(f.ids||[]).filter(c=>codeMap.has(c)).map(c=>codeMap.get(c))})).filter(f=>f.ids.length);
    }
    A.dur=Math.round((Date.now()-t0)/1000);
    it.analyses.push(A); logDiary(p,{kind:'análise', item:key, text:`${def.name}: índice de novidade ${A.novelty}; `+A.criteria.map(c=>`${c.t}: ${STATUS[c.status][1]}`).join('; ')});
    toast('Análise concluída em '+fmtDur(A.dur)+'.');
  }catch(e){ if (e.message!=='interrompida') toast('Análise: '+e.message, 8000); else toast('Análise interrompida.'); }
  clearInterval(tick); delete S.busy['an_'+key]; touch(p); render();
}
/* ---------- Consultas: o Qwen extrai os conceitos; o código monta e calibra ---------- */
const Q_MIN=20, Q_MAX=5000;
const conceptSchema={type:'object',required:['blocos'],properties:{blocos:{type:'array',items:{type:'object',required:['papel','rotulo','termos'],properties:{papel:{type:'string',enum:['objeto','fator','mecanismo','metodo','contexto']},rotulo:{type:'string'},termos:{type:'array',items:{type:'string'}}}}}}};
const CONCEPT_PROMPT=`Você prepara a busca bibliográfica de um item de pesquisa. Não escreva consultas: extraia os CONCEITOS que um artigo relevante precisa conter.
Devolva de 3 a 5 blocos, do mais essencial ao menos essencial:
- objeto: o que é estudado;
- fator: o que atua sobre o objeto;
- mecanismo: o efeito ou problema que o item investiga, traduzido para o vocabulário técnico da área (ex.: "mascarar o resultado" de um monitoramento por satélite = commission error, false change, misclassification);
- metodo: dado ou técnica, só se o item citar ou pressupor;
- contexto: lugar, bioma ou regime legal.
Em cada bloco, de 2 a 6 termos em inglês, de 1 a 3 palavras cada, que apareçam de fato em títulos e resumos científicos. Prefira o termo mais usado na literatura do tema, não a tradução literal (ex.: em savanas se escreve fire e burned area, raramente wildfire). Nomes de biomas e regiões podem ficar no original. Nunca escreva frases descritivas. "rotulo" é o nome curto do bloco em português.`;
const PAPEL={objeto:'objeto', fator:'fator', mecanismo:'mecanismo', metodo:'método', contexto:'contexto'};
function cleanTerm(t){ t=String(t||'').replace(/["“”()|+]/g,' ').replace(/(^|\s)-+/g,' ').replace(/\s+/g,' ').trim(); if(!t) return ''; const n=t.split(' ').length; return n>3?'':n>1?`"${t}"`:t; }
const blockStr = b => b.terms.length>1?`(${b.terms.join(' | ')})`:b.terms[0];
async function extractConcepts(key, text){
  const o=await LLM.chatValid({system:CONCEPT_PROMPT, user:`ITEM (${ITEMS[key].name}):\n${text}`, schema:conceptSchema}, o=>Array.isArray(o.blocos)&&o.blocos.length>=2?null:'blocos');
  const seen=new Set(), blocks=[];
  for (const b of o.blocos){
    const terms=(b.termos||[]).map(cleanTerm).filter(t=>{ const k=t.toLowerCase(); if(!t||seen.has(k)) return false; seen.add(k); return true; }).slice(0,6);
    if (terms.length) blocks.push({papel:b.papel||'', rotulo:(b.rotulo||b.papel||'').trim(), terms});
  }
  if (blocks.length<2) throw new Error('O Qwen não extraiu conceitos suficientes do item. Reescreva o item com mais detalhe ou escreva as consultas à mão.');
  return blocks.slice(0,5);
}
/* Combinações: todos os blocos e "todos menos um". O objeto e o contexto ficam sempre (sem contexto a busca sai do tema). Poucos resultados: retira o bloco menos essencial que não seja objeto nem contexto. */
async function buildQueries(key, text, onMsg){
  onMsg?.('Qwen extraindo os conceitos do item…');
  const blocks=await extractConcepts(key, text); const cache=new Map();
  const test=async ix=>{ const q=ix.map(i=>blockStr(blocks[i])).join(' + ');
    if (!cache.has(q)){ onMsg?.(`Testando combinações de conceitos (${cache.size+1})…`); cache.set(q, await testQuery(q)); await sleep(1100); }
    return {...cache.get(q), q, ix}; };
  const all=[...blocks.keys()], ctx=blocks.findIndex(b=>b.papel==='contexto'), fixo=i=>i===0||i===ctx;
  const combos=[all, ...all.filter(i=>!fixo(i)).map(i=>all.filter(j=>j!==i))].filter(c=>c.length>=2);
  const out=[];
  for (const c of combos){
    let ix=[...c], antes=[], r=await test(ix);
    while (!r.erro && r.total<Q_MIN && ix.length>2){ const d=[...ix].reverse().find(i=>!fixo(i)); if (d==null) break; antes.push({q:r.q,total:r.total}); ix=ix.filter(i=>i!==d); r=await test(ix); }
    if (!out.some(x=>x.q===r.q)) out.push({...r, antes});
  }
  const ok=x=>!x.erro && x.total>=Q_MIN && x.total<=Q_MAX;
  let pool=out.filter(ok).sort((a,b)=>b.ix.length-a.ix.length || a.total-b.total);
  if (!pool.length) pool=out.filter(x=>!x.erro).sort((a,b)=>Math.abs(Math.log((a.total||1)/300))-Math.abs(Math.log((b.total||1)/300)));
  const chosen=pool.slice(0,3);
  if (!chosen.length) throw new Error('O Semantic Scholar não respondeu aos testes. Tente de novo em alguns minutos.');
  return {blocks, list:chosen.map(x=>({consulta:x.q, total:x.total, top:x.top||[], erro:x.erro, antes:x.antes.length?x.antes:undefined,
    objetivo:'Cobre: '+x.ix.map(i=>blocks[i].rotulo).join(' · ')+(x.ix.length<blocks.length?' (sem: '+all.filter(i=>!x.ix.includes(i)).map(i=>blocks[i].rotulo).join(', ')+')':'')}))};
}
async function testQuery(q){
  try{ const j=await s2Fetch(`https://api.semanticscholar.org/graph/v1/paper/search/bulk?query=${encodeURIComponent(q)}&fields=title,year,citationCount&sort=citationCount:desc`);
    return {q, total:j.total??(j.data||[]).length, top:(j.data||[]).slice(0,5).map(d=>({title:d.title, year:d.year, c:d.citationCount}))}; }
  catch(e){ return {q, erro:e.message}; }
}
function lintQuery(q){
  const w=[]; for (const m of q.matchAll(/"([^"]+)"/g)) if (m[1].trim().split(/\s+/).length>3) w.push(`frase longa entre aspas: "${m[1]}"`);
  if ((q.match(/(^|\s)-\s*[\w("]/g)||[]).length>1) w.push('mais de uma exclusão (-)');
  if (q.split('+').length>5) w.push('blocos demais (+)');
  return w;
}
function storeQueries(it, list){
  const seen=new Set(); list=list.filter(x=>{ const k=normTxt(x.consulta); if(seen.has(k)) return false; seen.add(k); return true; });
  it.queries=list.map(x=>x.consulta).join('\n'); it.queryNotes=Object.fromEntries(list.map(x=>[x.consulta,x.objetivo]));
  it.queryPreview={at:nowISO(), hash:hashStr(it.queries), list:list.map(x=>({q:x.consulta, total:x.total, top:x.top||[], erro:x.erro, antes:x.antes}))};
}
ACTIONS.suggestQueries = async el => {
  const p=cur(), key=el.dataset.k, it=p.items[key], text=itemText(p,key);
  if (text.length<20) return toast('Escreva o item antes.');
  if (it.queries?.trim() && !confirm('Substituir as consultas atuais pelas sugeridas?')) return;
  S.busy['q_'+key]='Qwen extraindo os conceitos do item…'; render();
  try{ const B=await buildQueries(key, text, m=>{ S.busy['q_'+key]=m; render(); }); it.concepts=B.blocks; storeQueries(it, B.list); touch(p); }
  catch(e){ toast('Sugestão: '+e.message, 7000); }
  delete S.busy['q_'+key]; render();
};
ACTIONS.previewQueries = async el => {

  if (!qs.length) return toast('Escreva ou sugira as consultas primeiro.');
  S.busy['q_'+key]='Testando consultas no Semantic Scholar…'; render(); const prev=[];
  for (const q of qs){ prev.push(await testQuery(q)); await sleep(1100); }
  it.queryPreview={at:nowISO(), hash:hashStr(it.queries), list:prev}; touch(p); delete S.busy['q_'+key]; render();
};
function renderQueries(p, key){

    <textarea id="it_${key}_q" rows="3" data-bind="items.${key}.queries" data-rerender="1" placeholder="Clique em Sugerir para o Qwen propor a partir do seu texto">${esc(it.queries||'')}</textarea>
    ${it.concepts?.length?`<div class="small" style="margin:4px 0"><b>Conceitos extraídos</b> (do mais ao menos essencial):${it.concepts.map(b=>`<div><span class="pill">${esc(PAPEL[b.papel]||b.papel)}</span> ${esc(b.rotulo)}: <code>${esc(b.terms.join(' | '))}</code></div>`).join('')}</div>`:''}

    <div class="row" style="margin-top:6px">${busy?`<span class="pill warn">${esc(busy)}</span>`:`<button class="b sec" data-act="suggestQueries" data-k="${key}" ${LLM.online?'':'disabled'}>Sugerir consultas</button><button class="b sec" data-act="previewQueries" data-k="${key}" ${qs.length?'':'disabled'}>Testar consultas</button>`}</div>
    ${qs.map(q=>({q,w:lintQuery(q)})).filter(x=>x.w.length).map(x=>`<div class="small"><span class="pill warn">revise</span> <code>${esc(x.q)}</code>: ${esc(x.w.join('; '))}</div>`).join('')}
    ${pv?pv.map(x=>`<div class="small" style="margin-top:6px"><code>${esc(x.q)}</code> ${x.erro?`<span class="pill bad">${esc(x.erro)}</span>`:`→ <b>${x.total}</b> artigos ${flag(x.total)}${x.antes?.length?` <span class="muted">(ajustada: antes ${x.antes.map(a=>a.total).join(' → ')} artigos)</span>`:''}<div class="muted">Mais citados: ${x.top.map(t=>`${esc(t.title)} (${t.year||''})`).join(' · ')||'—'}</div>`}</div>`).join(''):(qs.length?'<p class="small muted">Teste as consultas para ver quantos artigos cada uma traz antes de analisar.</p>':'')}</div>`;
}
const frasesSchema={type:'object',required:['frases'],properties:{frases:{type:'array',items:{type:'object',required:['texto','ids'],properties:{texto:{type:'string'},ids:{type:'array',items:{type:'string'}}}}}}};
const cardSchema = withQuote => ({type:'object', required:['status','justificativa','sugestao', withQuote?'trecho':'ids'], properties:{
  status:{type:'string',enum:['atende','parcial','nao_atende']}, justificativa:{type:'string'}, sugestao:{type:'string'},
  ...(withQuote?{trecho:{type:'string'}}:{ids:{type:'array',items:{type:'string'}}})}});
const CARD_SYS = c => `Você é um revisor de periódico Q1 em sensoriamento remoto, geoprocessamento e ciências ambientais. Avalie UM critério: "${c.t}" — ${c.d}
Responda com: "status" (atende, parcial ou nao_atende), "justificativa" (até 60 palavras, específica), "sugestao" (onde e como melhorar, até 60 palavras; não reescreva o item inteiro). Seja rigoroso: na dúvida, "parcial". Português.`;

async function evalCriterion(p, key, c, text, A, evid){
  const base={id:c.id, t:c.t, src:c.src};
  if (c.src==='texto'){
    const o=await LLM.chatValid({system:CARD_SYS(c)+'\n"trecho": cópia literal do item que justifica o status, ou "" se o item não trata do critério.', user:`ITEM:\n${text}`, schema:cardSchema(true)}, o=>STATUS[o.status]?null:'status');
    return {...base, ...o, trechoOK:o.trecho?quoteOK(o.trecho,text):false};
  }
  if (c.src==='cadeia'){
    const other=itemText(p, c.of); if (other.length<20) return {...base, status:'sem_dados', justificativa:`Escreva ${ITEMS[c.of].name.toLowerCase()} para avaliar a coerência.`, sugestao:''};
    const o=await LLM.chatValid({system:CARD_SYS(c)+'\n"trecho": cópia literal do ITEM que mostra a ligação, ou "".', user:`${ITEMS[c.of].name.toUpperCase()}:\n${other}\n\nITEM (${ITEMS[key].name}):\n${text}`, schema:cardSchema(true)}, o=>STATUS[o.status]?null:'status');
    return {...base, ...o, trechoOK:o.trecho?quoteOK(o.trecho,text):false};
  }

    const j=p.journal; if (!j?.name) return {...base, status:'sem_dados', justificativa:'Escolha a revista-alvo no topo desta tela.', sugestao:''};
    const rs={total:0,data:[]}; const y=new Date().getFullYear(); const seen=new Set(); let falhou='';
    for (const q of (A.queries.length?A.queries:[text.slice(0,120)])){
      try{ const r=await s2Bulk(q, 40, `&venue=${encodeURIComponent(j.name)}&year=${y-5}-${y}`); for (const d of r.data){ const kk=(d.doi||d.title||'').toLowerCase(); if (kk && !seen.has(kk)){ seen.add(kk); rs.data.push(d); } } }
      catch(e){ falhou=e.message; }

    }
    rs.total=rs.data.length;
    if (!rs.data.length && falhou) return {...base, status:'sem_dados', justificativa:'Não foi possível consultar os artigos da revista: '+falhou, sugestao:''};
    if (rs.data.length<3) return {...base, status:'sem_dados', justificativa:`Só ${rs.data.length} artigo(s) de ${j.name} dos últimos 5 anos apareceram com os termos das consultas: amostra insuficiente para avaliar o alinhamento.`, sugestao:'Confira se o nome da revista está exato (como aparece no Semantic Scholar) ou amplie as consultas. Enquanto isso, avalie o alinhamento pela página de escopo da revista.', venueN:rs.data.length, venueRefs:rs.data.map(r=>({title:r.title, year:r.year, doi:r.doi}))};
    const ev=rs.data.slice(0,10).map((r,i)=>({code:'J'+(i+1), r}));
    const o=await LLM.chatValid({system:CARD_SYS(c)+'\n"ids": códigos J… dos artigos da revista mais próximos do item.', user:`REVISTA: ${j.name}\nITEM:\n${text}\n\nARTIGOS RECENTES DA REVISTA COM TERMOS PRÓXIMOS (${rs.total} encontrados):\n`+ev.map(x=>`${x.code}: ${x.r.title} (${x.r.year||''}). ${(x.r.abstract||'').slice(0,300)}`).join('\n'), schema:cardSchema(false)}, o=>STATUS[o.status]?null:'status');
    const m=new Map(ev.map(x=>[x.code,x.r])); const dec=t=>decode(t, c=>m.get(c)||null);
    return {...base, ...o, justificativa:dec(o.justificativa), sugestao:dec(o.sugestao), venueN:rs.total, venueRefs:(o.ids||[]).filter(x=>m.has(x)).map(x=>({title:m.get(x).title, year:m.get(x).year, doi:m.get(x).doi}))};
  }

  const ev=evid(); const m=new Map(ev.map(x=>[x.code,x.r.id]));
  const o=await LLM.chatValid({system:CARD_SYS(c)+'\n"ids": códigos A… dos artigos que sustentam a avaliação. Baseie-se nos artigos fornecidos.', user:`ITEM:\n${text}\n\n${c.novelty?`ÍNDICE DE NOVIDADE CALCULADO: ${A.novelty} (de 0 a 100; quanto menor, mais artigos já respondem).\n\n`:''}ARTIGOS MAIS PRÓXIMOS (classificação prévia entre colchetes):\n`+ev.map(x=>`${x.code} [${x.classe}]: ${x.r.title} (${x.r.year||''}). ${(x.r.abstract||'').slice(0,350)}`).join('\n'), schema:cardSchema(false)}, o=>STATUS[o.status]?null:'status');
  let status=o.status;
  if (c.novelty){ const ja=A.top.filter(t=>t.classe==='ja_responde').length;   // o status da novidade vem do índice e da contagem, não da opinião do modelo
    status = A.novelty==null || A.onTopic<Math.min(10, Math.ceil(A.top.length/2)) ? 'sem_dados' : (ja>=3 || A.novelty<40) ? 'nao_atende' : (ja>=1 || A.novelty<70) ? 'parcial' : 'atende'; }
  const dec=t=>decode(t, c=>m.has(c)?recById(p,m.get(c)):null);
  return {...base, ...o, justificativa:dec(o.justificativa), sugestao:dec(o.sugestao), status, ids:(o.ids||[]).filter(x=>m.has(x)).map(x=>m.get(x))};

const refPlain = r => r ? `${((r.authors||'').split(/[;,]/)[0].trim().split(' ').pop()||'s.a.')} ${r.year||''}`.trim() : '';
const decode = (t, get) => String(t||'').replace(/\b([AJR]\d{1,3})\b/g, c=>{ const r=get(c); return r?refPlain(r):c; });   // A1, J2, R3 → Autor ano
const fmtDur = s => { s=Math.max(0,Math.round(s)); return `${Math.floor(s/60)} min ${String(s%60).padStart(2,'0')} s`; };
const refShort = r => r ? `${esc((r.authors||'').split(/[;,]/)[0].trim().split(' ').pop()||'s.a.')} ${r.year||''}` : '';
const refLink = r => r ? (r.doi?`<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener" title="${esc(r.title)}">${refShort(r)}</a>`:`<span title="${esc(r.title)}">${refShort(r)}</span>`) : '';
function journalPicker(p){
  const j=p.journal; const opts=S.catalog.slice(0,3000).map(c=>`<option value="${esc(c.nome)}">`).join('');
  const links = j ? [j.pagina&&`<a href="${esc(j.pagina)}" target="_blank" rel="noopener">Página</a>`, j.normas&&`<a href="${esc(j.normas)}" target="_blank" rel="noopener">Normas</a>`, j.escopo&&`<a href="${esc(j.escopo)}" target="_blank" rel="noopener">Escopo</a>`].filter(Boolean).join(' · ') : '';
  return `<div class="row small"><label>Revista-alvo</label><input type="text" id="jrnl" list="dlJ" style="max-width:360px" value="${esc(j?.name||'')}" placeholder="${S.catalog.length?'escolha do catálogo do LabResearch':'nome da revista'}"><datalist id="dlJ">${opts}</datalist><button class="b sec" data-act="setJournal">Definir</button>${j?.qualis?`<span class="pill">Qualis ${esc(j.qualis)}</span>`:''}${j?.fora?'<span class="pill warn">fora do catálogo: confira o nome</span>':''} ${links}</div>`;
}
ACTIONS.setJournal = () => { const p=cur(); const v=$('#jrnl').value.trim(); if(!v){ p.journal=null; touch(p); return render(); }
  const c=S.catalog.find(x=>normTxt(x.nome)===normTxt(v)); p.journal = c ? {name:c.nome, issn:c.issn, pagina:c.pagina, normas:c.normas, escopo:c.escopo, qualis:c.qualis} : {name:v, fora:true};
  if (!c) toast('Essa revista não está no catálogo do LabResearch (periódicos Springer e os que você cadastrou no LabResearch). Pode usar assim mesmo: o alinhamento busca os artigos da revista pelo nome exato no Semantic Scholar, então escreva o nome completo e oficial.', 9000);
  touch(p); render(); };

function renderItem(p, key){
  const def=ITEMS[key], it=p.items[key], b=S.busy['an_'+key];
  const sel = S.selAnalysis?.[key]; const A = it.analyses.find(a=>a.id===sel) || it.analyses[it.analyses.length-1];

    <div class="row" style="margin-top:8px">${b?`<span class="pill warn">${esc(b.msg||'')}</span>${b.t0?`<span class="pill" id="anTimer">${fmtDur((Date.now()-b.t0)/1000)}</span>`:''}${b.total?`<div class="progress" style="flex:1;min-width:120px"><div style="width:${(100*(b.done||0)/b.total).toFixed(0)}%"></div></div>`:''}<button class="b sec" data-act="stopAnalysis" data-k="${key}">Parar</button>`:

}

function renderAnalysis(p, key, A, stale){

  const card=c=>{ const [cls,lab]=STATUS[c.status]; const refs=(c.ids||[]).map(id=>refLink(recById(p,id))).filter(Boolean);
    return `<div class="crit"><div class="row"><b>${esc(c.t)}</b><span class="pill ${cls}">${lab}</span><span class="pill">${SRC_LABEL[c.src]}</span>${c.id==='novidade'&&A.novelty!=null?`<span class="small">índice ${A.novelty}</span>`:''}</div>

      ${c.venueRefs?.length?`<div class="small muted">Na revista (${c.venueN} com termos próximos): ${c.venueRefs.map(r=>r.doi?`<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)).join('; ')}</div>`:''}</div>`; };
  const pill=cl=>cl==='ja_responde'?'<span class="pill bad">já responde</span>':cl==='em_parte'?'<span class="pill warn">em parte</span>':cl==='fora_do_tema'?'<span class="pill">fora do tema</span>':'<span class="pill">não responde</span>';
  const filt=S.topFilter||'relevantes';
  const list=A.top.filter(t=>filt==='todos'||t.classe==='ja_responde'||t.classe==='em_parte');
  return `<div class="card"><div class="row"><h2 style="margin:0;flex:1">Análise de ${fmtDate(A.at)}</h2><button class="b sec" data-act="exportA" data-k="${key}" data-a="${A.id}" data-f="txt">Exportar TXT</button><button class="b sec" data-act="exportA" data-k="${key}" data-a="${A.id}" data-f="docx">Exportar Word</button></div>${stale?'<p><span class="pill warn">O texto mudou depois desta análise. Clique em Analisar para avaliar a versão atual.</span></p>':''}
    ${A.warnings.map(w=>`<div class="small"><span class="pill warn">atenção</span> ${esc(w)}</div>`).join('')}
    <div style="margin:8px 0"><span class="kpi"><b>${A.novelty??'—'}</b><span class="small muted">índice de novidade (0–100)</span></span><span class="kpi"><b>${A.top.length}</b><span class="small muted">artigos lidos${A.foraN!=null?` (${A.onTopic} do tema, ${A.foraN} fora)`:''}</span></span><span class="kpi"><b>${A.corpusN}</b><span class="small muted">no corpus com resumo</span></span><span class="kpi"><b>${A.totals.reduce((s,x)=>s+(x.total||0),0)}</b><span class="small muted">resultados das buscas</span></span>${A.dur?`<span class="kpi"><b>${fmtDur(A.dur)}</b><span class="small muted">duração da análise</span></span>`:''}</div>
    <table class="small" style="max-width:520px"><tr><th>Entre os mais próximos</th><th>Do tema</th><th>Fora do tema</th><th>Já respondem</th><th>Em parte</th><th>Índice</th></tr>${A.sat.map(s=>`<tr><td>${s.n}</td><td>${s.on??s.n}</td><td>${s.fora??'—'}</td><td>${s.ja}</td><td>${s.pa}</td><td>${s.idx??'—'}</td></tr>`).join('')}</table>
    <p class="small muted">Novidade: atende com índice ≥ 70 e nenhum artigo que já responde; parcial se houver 1 ou 2 que já respondem ou índice entre 40 e 69; não atende com 3 ou mais, ou índice abaixo de 40. Índice = 100 × (1 − (já respondem + ½ em parte) ÷ artigos do tema lidos); os artigos fora do tema não entram na conta. Com menos de 10 artigos do tema (ou menos da metade dos lidos), a novidade fica sem dados. Mede a sobreposição com os artigos mais próximos que as buscas encontraram; depende das consultas e da cobertura da base. ${A.saturou?'Saturação: nenhum artigo que já responde no último terço da lista.':''}</p></div>
  <div class="card"><h2>Critérios</h2>${A.criteria.map(card).join('')}</div>
  ${A.summary.length?`<div class="card"><h2>O que a literatura diz</h2>${A.summary.map(f=>`<p class="small">${esc(f.texto)} <span class="muted">[${f.ids.map(id=>refLink(recById(p,id))).join('; ')}]</span></p>`).join('')}</div>`:''}
  <div class="card"><h2>Artigos lidos</h2><div class="tabs"><button class="${filt==='relevantes'?'on':''}" data-act="topF" data-f="relevantes">já respondem e em parte</button><button class="${filt==='todos'?'on':''}" data-act="topF" data-f="todos">todos (${A.top.length})</button></div>
    ${list.map((t,i)=>{ const r=recById(p,t.id); if(!r) return ''; const c=r.cls?.[A.ck||(key+'|'+A.textHash)]; return recLine(r, `<div class="small">${pill(t.classe)} <span class="muted">proximidade ${t.s}</span> ${c?.trecho?`<span class="quote">“${esc(c.trecho)}”</span>`:''}</div>`); }).join('')||'<p class="muted small">Nenhum artigo nesta categoria.</p>'}</div>`;
}

/* ---------- Programa: índice de corroboração ---------- */
async function savePrograms(){ S.programs.forEach(p=>p.updatedAt ||= nowISO()); await DB.put('kv', S.programs, 'programs'); Sync.schedule(); }
function touchProgram(pr){ pr.updatedAt=nowISO(); savePrograms(); }
function corroboration(pr){
  const st=pr.studies||[]; const concl=st.filter(s=>s.resultado==='corroborada'||s.resultado==='refutada');
  const w=s=>Number(s.severidade)||1; const sw=concl.reduce((a,s)=>a+w(s),0);
  const idx = sw ? Math.round(100*concl.filter(s=>s.resultado==='corroborada').reduce((a,s)=>a+w(s),0)/sw) : null;
  const ctx=new Set(concl.map(s=>normTxt(s.contexto||'')).filter(Boolean));
  return {idx, n:st.length, concl:concl.length, inconc:st.filter(s=>s.resultado==='inconclusiva').length, refut:concl.filter(s=>s.resultado==='refutada').length, ctx:ctx.size};
}
function renderProgram(){
  const pr = S.programs.find(x=>x.id===S.progId) || S.programs[0];
  const head = `<div class="card"><div class="row"><h2 style="margin:0;flex:1">Programa de pesquisa</h2>
    <select id="progSel" data-chg="progSel" style="width:auto">${S.programs.map(x=>`<option value="${x.id}" ${pr&&x.id===pr.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <button class="b sec" data-act="newProgram">+ Programa</button></div>
    <p class="small muted">Registre o resultado de cada estudo do programa. O índice mostra quanto as hipóteses do programa resistiram aos testes conclusivos, ponderado pela severidade do teste. Não é uma medida de aceitação pela comunidade, que depende de replicação por terceiros.</p></div>`;
  if (!pr) return head;
  const c=corroboration(pr); const res=['corroborada','refutada','inconclusiva'];
  return head + `<div class="card"><input type="text" id="prName" data-bindp="name" data-pid="${pr.id}" value="${esc(pr.name)}" style="font-weight:600;font-size:16px">
    <textarea id="prDesc" rows="2" data-bindp="desc" data-pid="${pr.id}" placeholder="Núcleo do programa: a ideia central que os estudos testam" style="margin-top:6px">${esc(pr.desc||'')}</textarea>
    <div style="margin:10px 0"><span class="kpi"><b>${c.idx??'—'}</b><span class="small muted">índice de corroboração (0–100)</span></span><span class="kpi"><b>${c.concl}</b><span class="small muted">testes conclusivos</span></span><span class="kpi"><b>${c.refut}</b><span class="small muted">refutações</span></span><span class="kpi"><b>${c.inconc}</b><span class="small muted">inconclusivos</span></span><span class="kpi"><b>${c.ctx}</b><span class="small muted">contextos distintos</span></span></div>
    ${c.concl<3?'<p class="small"><span class="pill warn">poucos testes</span> Com menos de 3 testes conclusivos o índice é instável.</p>':''}
    ${c.concl>=3&&c.ctx<2?'<p class="small"><span class="pill warn">um só contexto</span> Todos os testes vêm do mesmo contexto: a generalização ainda não foi testada.</p>':''}
    <p class="small muted">Índice = 100 × Σ severidade dos testes corroborados ÷ Σ severidade dos testes conclusivos. Severidade: 1 = previsão pouco arriscada; 3 = previsão arriscada, que tinha boa chance de falhar.</p>
    <div style="overflow-x:auto"><table class="small"><tr><th>Estudo</th><th>Hipótese testada</th><th>Resultado</th><th>Severidade</th><th>Contexto (região, sensor, escala)</th><th>Notas</th><th></th></tr>
    ${(pr.studies||[]).map((s,i)=>`<tr><td><input type="text" id="ps_t_${i}" data-bindp="studies.${i}.titulo" data-pid="${pr.id}" value="${esc(s.titulo||'')}"></td>
      <td><textarea id="ps_h_${i}" rows="2" data-bindp="studies.${i}.hipotese" data-pid="${pr.id}">${esc(s.hipotese||'')}</textarea></td>
      <td><select data-bindpc="studies.${i}.resultado" data-pid="${pr.id}">${res.map(r=>`<option ${s.resultado===r?'selected':''}>${r}</option>`).join('')}</select></td>
      <td><select data-bindpc="studies.${i}.severidade" data-pid="${pr.id}">${[1,2,3].map(n=>`<option ${Number(s.severidade)===n?'selected':''}>${n}</option>`).join('')}</select></td>
      <td><input type="text" id="ps_c_${i}" data-bindp="studies.${i}.contexto" data-pid="${pr.id}" value="${esc(s.contexto||'')}"></td>
      <td><input type="text" id="ps_n_${i}" data-bindp="studies.${i}.notas" data-pid="${pr.id}" value="${esc(s.notas||'')}"></td>
      <td><button class="b sec" data-act="delStudy" data-i="${i}">×</button></td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:8px"><button class="b" data-act="addStudy">+ Estudo</button>${cur()?`<button class="b sec" data-act="addStudyFromProject">+ Hipótese do projeto atual</button>`:''}</div></div>`;
}
